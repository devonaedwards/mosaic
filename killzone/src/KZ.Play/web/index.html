<!doctype html>
<!--
  KILL ZONE - a real-time strategy video game.
  The playable interface. Crude on purpose: coloured shapes, one-pixel lines,
  a legend. No art, no animation.

  It knows nothing about the host serving it. Six fetches - /api/static,
  /api/state, /api/command, /api/control - and everything else is a canvas and a
  transform from metres to pixels.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KILL ZONE</title>
<style>
  :root {
    --bg: #0a0c0e;
    --panel: #12161a;
    --line: #262d33;
    --ink: #cfd8de;
    --dim: #7b8892;
    --own: #4fd1ff;
    --foe: #ff5a4f;
    --green: #46d17a;
    --amber: #ffb02e;
    --black: #8a8f94;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 12px/1.35 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    -webkit-text-size-adjust: 100%;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #top {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top, 0px));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #top .cell { white-space: nowrap; }
  #top .k { color: var(--dim); }
  #top b { font-weight: 600; }
  button {
    font: inherit; color: var(--ink); background: #1b2229;
    border: 1px solid var(--line); border-radius: 3px;
    padding: 4px 8px; cursor: pointer; min-height: 30px;
  }
  button:hover { background: #232c34; }
  button.on { background: #2b4657; border-color: var(--own); color: #eaf7ff; }

  /* positioned so the phone's slide-over panel stays inside the map area
     rather than covering the top bar's own toggle button */
  #middle { flex: 1; display: flex; min-height: 0; position: relative; }
  #mapwrap { position: relative; flex: 1; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #side {
    width: 250px; flex: none; background: var(--panel);
    border-left: 1px solid var(--line); overflow-y: auto; padding: 6px;
  }
  #side h3 {
    margin: 8px 0 4px; font-size: 11px; color: var(--dim);
    font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  }
  .row {
    padding: 3px 4px; border-bottom: 1px solid #1a2026; cursor: pointer;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .row:hover { background: #1b2229; }
  .row .r { color: var(--dim); }
  .foe { color: var(--foe); }
  /* The sky is the only part of the contact list with a clock on it. */
  .row.inbound { background: #2a1a18; }
  .cell.alert { color: var(--dim); }
  .cell.alert.on { color: #ffd0cc; font-weight: 600; }
  /* The ground threat. Two states rather than one, because "a column is
     coming" and "a column is coming and nothing is stopping it" are different
     pieces of news and the second is the one that loses the sector. */
  .cell.ground { color: var(--dim); }
  .cell.ground.on { color: #ffd0cc; font-weight: 600; }
  .cell.ground.urgent { color: #1a1013; background: #ff8e7f; font-weight: 700; }
  .own { color: var(--own); }
  #log { font-size: 11px; }
  #log div { padding: 1px 0; color: var(--dim); border-bottom: 1px solid #161b20; }
  #log div.hot { color: var(--ink); }

  #hangar {
    display: flex; gap: 6px; padding: 6px 10px; overflow-x: auto;
    background: var(--panel); border-top: 1px solid var(--line);
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    flex: none; width: 116px; text-align: left; padding: 5px 6px;
    border: 1px solid var(--line); border-radius: 3px; background: #171d23;
    cursor: pointer; line-height: 1.3;
  }
  .card.armed { border-color: var(--own); background: #23404f; }
  .card.cant { opacity: .4; }
  .card .n { font-weight: 600; }
  .card .s { color: var(--dim); font-size: 11px; }

  #sidebtn { display: none; }
  #legend {
    position: absolute; left: 8px; bottom: 8px; padding: 5px 7px;
    background: rgba(10,12,14,.82); border: 1px solid var(--line);
    font-size: 11px; color: var(--dim); pointer-events: none; max-width: 60%;
  }
  #banner {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    padding: 6px 14px; background: rgba(10,12,14,.9);
    border: 1px solid var(--own); color: #eaf7ff; display: none;
  }

  @media (max-width: 720px) {
    /* A phone gets the map, not the chrome. The top bar loses a row by
       shrinking rather than by hiding anything the player needs mid-match. */
    #top { gap: 5px; padding: 4px 6px; font-size: 11px; }
    button { padding: 3px 6px; min-height: 26px; }
    #obj { display: none; }
    #side {
      position: absolute; right: 0; top: 0; bottom: 0; width: 82%; max-width: 320px;
      z-index: 5; display: none;
    }
    #side.open { display: block; }
    #sidebtn { display: inline-block; }
    #legend { display: none; }
    .card { width: 104px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="cell"><span class="k">T+</span><b id="clock">0:00</b></span>
    <span class="cell"><span class="k">◆</span><b id="mat">0</b></span>
    <span class="cell"><span class="k">◇</span><b id="tp">0</b></span>
    <span class="cell"><span class="k">crews</span> <b id="crews">0/0</b></span>
    <span class="cell" id="cond">—</span>
    <span class="cell alert" id="alert"></span>
    <span class="cell ground" id="ground"></span>
    <span class="cell" id="obj">—</span>
    <button id="playbtn">▶ play</button>
    <button id="stepbtn">▸| tick</button>
    <button id="spd1" class="spd on">1×</button>
    <button id="spd2" class="spd">2×</button>
    <button id="spd4" class="spd">4×</button>
    <button id="padbtn">set pad</button>
    <button id="sensbtn" class="on">sensors</button>
    <button id="emitbtn" style="display:none">emit</button>
    <button id="resetbtn">reset</button>
    <button id="sidebtn">panel</button>
  </div>

  <div id="middle">
    <div id="mapwrap">
      <canvas id="cv"></canvas>
      <div id="legend"></div>
      <div id="banner"></div>
    </div>
    <div id="side">
      <h3>objectives</h3>
      <div id="objlist"></div>
      <h3>contacts</h3>
      <div id="contacts"></div>
      <h3>your sorties</h3>
      <div id="sorties"></div>
      <h3>log</h3>
      <div id="log"></div>
    </div>
  </div>

  <div id="hangar"></div>
</div>
<script src="app.js"></script>
</body>
</html>
